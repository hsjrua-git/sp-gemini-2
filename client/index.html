<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the app paint under the notch / rounded corners;
         the CSS then pads content back in with env(safe-area-inset-*).
         maximum-scale is intentionally left unset so users can still pinch-zoom. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Tints the mobile browser / status-bar chrome to match the app surface,
         one value per color scheme. -->
    <meta
      name="theme-color"
      content="#f6f7fb"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f131c"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Standalone (installed / Capacitor) behaviour on iOS. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Student Panel" />
    <!-- Student codes look like phone numbers to iOS Safari; stop it linkifying
         them (and dates) as tel: links. -->
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Track students, enter periodic scores against configurable parameters, and review results and trends."
    />
    <meta property="og:title" content="Student Panel" />
    <meta property="og:description" content="Track students, enter periodic scores against configurable parameters, and review results and trends." />
    <title>Student Panel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
